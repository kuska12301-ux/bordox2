<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOR DROP · Админка</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff1f7;color:#171923;font:14px system-ui,sans-serif}main{max-width:980px;margin:auto;padding:24px 16px 80px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:25px;margin:0}.badge{background:#111827;color:#fff;padding:8px 12px;border-radius:20px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 8px 28px #27314c0d}.stat b{display:block;font-size:22px}.stat small,.muted{color:#7b8190}form{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}input,select,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #e4e7ee;min-width:0}button{border:0;background:#087ef5;color:#fff;font-weight:750;cursor:pointer}.secondary{background:#eef1f6;color:#545b68}.row{display:grid;grid-template-columns:1.4fr repeat(4,1fr);align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #eef0f4}.row:last-child{border:0}.hidden{display:none}.error{color:#cf3030}.scroll{overflow:auto;max-height:430px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{flex:1}.tabs{display:flex;gap:7px;margin-bottom:14px;overflow:auto}.tabs button{background:#fff;color:#687080;white-space:nowrap}.tabs button.active{background:#087ef5;color:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.row{min-width:720px}form{grid-template-columns:1fr 1fr}form input:first-child{grid-column:1/-1}.card{overflow:hidden}}
body{background:radial-gradient(circle at 12% 5%,#542054,transparent 30%),radial-gradient(circle at 88% 12%,#6b2a14,transparent 24%),#0d0913;color:#fff}body:before{content:'🎃';position:fixed;left:3vw;top:12vh;font-size:64px;opacity:.22;filter:drop-shadow(0 0 18px #ff7900)}body:after{content:'👻';position:fixed;right:4vw;top:25vh;font-size:58px;opacity:.18}.card,.tabs button{background:#1e1628;color:#fff;border:1px solid #ff812c35;box-shadow:0 12px 36px #0007}.badge,.tabs button.active,button{background:linear-gradient(135deg,#ff7500,#8c2eff)}input,select{background:#140f1c;color:#fff;border-color:#5b3b65}.muted,.stat small{color:#b9a9c5}.row{border-color:#382943}.secondary{background:#34263e;color:#fff}input,select{outline:none;appearance:none;transition:border-color .18s,box-shadow .18s,background .18s}input::placeholder{color:#8f7d9d}input:focus,select:focus{background:#1b1225;border-color:#ff812c;box-shadow:0 0 0 3px #ff812c24,0 0 22px #8c2eff20}button{transition:transform .15s,filter .15s,box-shadow .15s}button:hover{filter:brightness(1.08);box-shadow:0 8px 22px #8c2eff35}button:active{transform:scale(.98)}
</style><main><header><div><h1>🎃 BOR DROP</h1><span class="muted">Панель администратора · Halloween Edition</span></div><span class="badge" id="admin">Проверка…</span></header><p id="status"></p><section id="panel" class="hidden"><div class="grid" id="stats"></div><div class="tabs"><button class="active" data-tab="promos">Промокоды</button><button data-tab="balances">Баланс</button><button data-tab="users">Пользователи</button><button data-tab="transactions">Транзакции</button><button data-tab="audit">Аудит</button></div><section data-section="promos"><div class="card"><h2>Создать промокод</h2><form id="promo-form"><input id="promo-code" placeholder="Код START10" maxlength="32" required><input id="promo-amount" type="number" min="0.01" max="10000" step="0.01" placeholder="Сумма USDT" required><input id="promo-wager" type="number" min="0" max="1000000" step="0.01" placeholder="Вагер USDT" value="0" required><input id="promo-limit" type="number" min="1" max="100000" step="1" value="100" required><button>Создать</button></form></div><div class="card"><h2>Все промокоды</h2><div class="scroll" id="promos"></div></div></section><section class="hidden" data-section="balances"><div class="card"><h2>Выдать или снять баланс</h2><form id="balance-form"><input id="balance-user" placeholder="Telegram ID" required><select id="balance-operation"><option value="credit">Выдать</option><option value="debit">Снять</option></select><input id="balance-amount" type="number" min="0.01" max="100000" step="0.01" placeholder="Сумма USDT" required><input id="balance-reason" placeholder="Причина" maxlength="160" required><button>Применить</button></form></div></section><section class="hidden" data-section="users"><div class="card"><div class="toolbar"><input id="user-search" placeholder="Поиск по ID, username или имени"><button class="secondary" id="refresh">Обновить</button></div><div class="scroll" id="users"></div></div></section><section class="hidden" data-section="transactions"><div class="card"><div class="toolbar"><input id="transaction-search" placeholder="Поиск транзакций"><button class="secondary" id="export-transactions">Экспорт CSV</button></div><div class="scroll" id="transactions"></div></div></section><section class="hidden" data-section="audit"><div class="card"><h2>Действия администраторов</h2><div class="scroll" id="audit"></div></div></section></section></main><script src="/admin.js"></script></html>
